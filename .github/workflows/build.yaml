---
name: Build

on: # yamllint disable-line rule:truthy
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Run CI once per day (at 06:00 UTC)
  # This ensures that even if there haven't been commits that we are still
  # testing against latest version of ansible-test for each ansible-core
  # version:
  schedule:
    - cron: "0 6 * * *"

jobs:
  lint:
    runs-on: ubuntu-latest
    name: "Run ansible-lint"
    steps:
      - name: Check out collection
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run nox
        uses: ansible-community/antsibull-nox@main

  sanity:
    uses: ansible-community/antsibull-nox/.github/workflows/reusable-nox-matrix.yml@main
    with:
      upload-codecov: false

  build:
    name: Build for ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    needs:
      - sanity
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: almalinux-9
            shortcut: el9
            container-name: almalinux9
          - name: almalinux-10
            shortcut: el10
            container-name: almalinux10
          - name: centos-stream-9
            shortcut: el9s
            container-name: el9stream
          - name: centos-stream-10
            shortcut: el10s
            container-name: el10stream
    container:
      image: quay.io/ovirt/buildcontainer:${{ matrix.container-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install dependencies
        run: dnf install -y git rpm-build python3-pip

      - name: Install python dependencies
        run: pip3 install antsibull-changelog

      - name: Install ansible.posix
        run: ansible-galaxy collection install -c ansible.posix

      - name: Set build environment
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" =~ ([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "RPM_VERSION=${BASH_REMATCH[1]}" >> $GITHUB_ENV
              echo "PACKAGE_RPM_RELEASE=${BASH_REMATCH[2]}" >> $GITHUB_ENV
            else
              echo "PACKAGE_RPM_RELEASE=1" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_SUFFIX=.$(date --utc +%Y%m%d%H%M%S).git$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Run build.sh
        run: .automation/build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.shortcut }}
          path: exported-artifacts

  publish-rpms:
    permissions:
      artifact-metadata: read
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ovirt/ovirt-workflows/.github/workflows/publish-rpms.yml@main
    secrets: inherit
