---
- ansible.builtin.include_tasks: auth_sso.yml
- name: Fetch host facts
  ovirt.ovirt.ovirt_host_info:
    pattern: name={{ he_host_name }}
    auth: "{{ ovirt_auth }}"
  register: host_result
  until: host_result is succeeded and host_result.ovirt_hosts|length >= 1
  retries: 50
  delay: 10
- name: Connect NVMe-oF subsystem
  ovirt.ovirt.ovirt_host:
    auth: "{{ ovirt_auth }}"
    state: nvmeofconnect
    name: "{{ he_host_name }}"
    nvmeof:
      address: "{{ he_nvmeof_address }}"
      port: "{{ he_nvmeof_port }}"
      nqn: "{{ he_nvmeof_nqn }}"
      host_nqn: "{{ he_nvmeof_host_nqn | default(omit) }}"
      dhchap_key: "{{ he_nvmeof_dhchap_key | default(omit) }}"
  register: otopi_nvmeof_connect
